<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <title>Calculator Pro</title>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0,maximum-scale=1.0, user-scalable=no"
    />
    <meta name="theme-color" content="#8fa939" />

    <link rel="stylesheet" href="./index.css" />
    <link rel="manifest" href="./manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&family=Rubik+Mono+One&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  </head>
  <body>
    <div class="calculator">
      <div class="container">
        <input type="text" id="result" readonly />
        <input type="text" id="calcul" value="0" readonly />
      </div>

      <div class="buttons">
        <button class="bgcolor--orange color--white" onclick="clearResult()">
          AC
        </button>
        <button class="bgcolor--orange color--white" onclick="backspace()">
          C
        </button>
        <button class="bgcolor--grey" onclick="toggleSign()">+/-</button>
        <button class="bgcolor--grey" onclick="percent()">%</button>

        <button onclick="addToNumber('7')">7</button>
        <button onclick="addToNumber('8')">8</button>
        <button onclick="addToNumber('9')">9</button>
        <button class="bgcolor--orange" onclick="addToResult('*')">×</button>

        <button onclick="addToNumber('4')">4</button>
        <button onclick="addToNumber('5')">5</button>
        <button onclick="addToNumber('6')">6</button>
        <button class="bgcolor--orange" onclick="addToResult('-')">-</button>

        <button onclick="addToNumber('1')">1</button>
        <button onclick="addToNumber('2')">2</button>
        <button onclick="addToNumber('3')">3</button>
        <button class="bgcolor--orange" onclick="addToResult('+')">+</button>

        <button onclick="addToNumber('0')">0</button>
        <button onclick="addToNumber(',')">.</button>
        <button class="bgcolor--blue color--white" onclick="calculate()">
          =
        </button>
        <button class="bgcolor--orange" onclick="addToResult('/')">÷</button>
      </div>
      <div class="container-btn">
        <button id="full-history">Show All</button>
        <button id="clear-history">Clear All</button>
        <button id="sum-selected">Total Select</button>
      </div>
      <div class="history-container">
        <div
          style="
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1rem;
          "
        >
          <h4>Lịch sử</h4>
          <button id="unselect">Unselect</button>
        </div>

        <sub id="notification"></sub>
        <ul id="historyList"></ul>
      </div>
    </div>
    <div id="copy-by-box">
      <div class="copy-by-item">
        <p>T</p>
      </div>
      <div class="copy-by-item">
        <small>Designer by</small>
        <p>KSC88</p>
      </div>
      <div class="copy-by-item">
        <small>©</small>
        <small>767</small>
      </div>
    </div>
    <!-- <script src="./index.js"></script> -->
    <script src="./index-2.js"></script>
  </body>
</html>
