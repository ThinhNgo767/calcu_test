<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <title>Calculator Pro</title>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0,maximum-scale=1.0, user-scalable=no"
    />
    <meta name="theme-color" content="#8fa939" />

    <link rel="stylesheet" href="./index.css" />
    <link rel="manifest" href="./manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&family=Rubik+Mono+One&display=swap"
      rel="stylesheet"
    />
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/js/all.min.js"
      integrity="sha512-6BTOlkauINO65nLhXhthZMtepgJSghyimIalb+crKRPhvhmsCdnIuGcVbR5/aQY2A+260iC1OPy1oCdB6pSSwQ=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    ></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  </head>
  <body>
    <div class="calculator">
      <div class="container">
        <div id="result"></div>
        <div id="calcul">0</div>

        <button class="history-btn" id="history-btn">
          <i class="fa-solid fa-file-medical"></i>
          <small>LỊCH SỬ</small>
        </button>
      </div>

      <div class="buttons">
        <button class="bgcolor--orange color--white" onclick="clearResult()">
          AC
        </button>
        <button class="bgcolor--orange color--white" onclick="backspace()">
          C
        </button>
        <button class="bgcolor--grey" onclick="toggleSign()">+/-</button>
        <button class="bgcolor--grey" onclick="percent()">%</button>

        <button onclick="addToNumber('7')">7</button>
        <button onclick="addToNumber('8')">8</button>
        <button onclick="addToNumber('9')">9</button>
        <button class="bgcolor--orange" onclick="addToResult('*')">×</button>

        <button onclick="addToNumber('4')">4</button>
        <button onclick="addToNumber('5')">5</button>
        <button onclick="addToNumber('6')">6</button>
        <button class="bgcolor--orange" onclick="addToResult('-')">-</button>

        <button onclick="addToNumber('1')">1</button>
        <button onclick="addToNumber('2')">2</button>
        <button onclick="addToNumber('3')">3</button>
        <button class="bgcolor--orange" onclick="addToResult('+')">+</button>

        <button onclick="addToNumber('0')">0</button>
        <button onclick="addToNumber(',')">.</button>
        <button class="bgcolor--blue color--white" onclick="calculate()">
          =
        </button>
        <button class="bgcolor--orange" onclick="addToResult('/')">÷</button>
      </div>
    </div>
    <div class="container-history" id="container-history">
      <div class="container-btn">
        <button id="back-cal">
          <i class="fa-solid fa-right-from-bracket"></i> Back
        </button>
        <button id="unselect">
          <i class="fa-solid fa-square-check"></i> SelectAll
        </button>
        <button id="full-history">
          Show All <i class="fa-solid fa-arrow-down-short-wide"></i>
        </button>
        <button id="clear-history">
          Clear All <i class="fa-solid fa-trash-can-arrow-up"></i>
        </button>
        <!-- <button id="sum-selected">
            Total Select <i class="fa-solid fa-calculator"></i>
          </button> -->
      </div>
      <div class="total-box">
        <p class="total-text">Tổng đã chọn</p>
        <input
          type="text"
          value="0"
          class="total-input"
          id="check-resutl-total"
          readonly
          disabled
        />
      </div>
      <div class="history-box">
        <sub id="notification"></sub>
        <ul id="historyList"></ul>
      </div>
    </div>

    <script src="./index.js"></script>
  </body>
</html>
